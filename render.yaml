# Render Blueprint for Video Compressor API
# Deploy: https://dashboard.render.com/blueprints

services:
  - type: web
    name: video-compressor-api
    runtime: docker
    plan: free  # Options: free, starter, standard, standard_plus
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: WORKERS
        value: "1"
      - key: MAX_FILE_SIZE
        value: "1073741824"  # 1GB - adjust based on plan
      - key: CLEANUP_HOURS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /
    # Uncomment for persistent storage:
    # disk:
    #   name: video-outputs
    #   mountPath: /app/outputs
    #   sizeGB: 5

